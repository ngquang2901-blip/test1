appId: com.toolflow.desktop
productName: ToolFlow
copyright: ToolFlow
directories:
  buildResources: build
  output: dist
# main/preload/renderer are bundled by electron-vite; only better-sqlite3 (native, prebuilt per platform) comes from node_modules
files:
  - out/**
  - package.json
  - '!out/probe/**'
  - '!**/node_modules/better-sqlite3/{deps,src,docs,benchmark}/**'
  - '!**/node_modules/better-sqlite3/binding.gyp'
extraResources:
  - from: ../extension
    to: extension
    filter: ['**/*', '!test/**', '!pair.json', '!.gitignore', '!package.json']
asarUnpack:
  - '**/*.node'
npmRebuild: false
win:
  executableName: ToolFlow
  target:
    - target: nsis
      arch: [x64]
  # unsigned: Windows SmartScreen asks once ("More info" → "Run anyway"); building on Linux needs wine (see docs/packaging.md)
nsis:
  artifactName: ToolFlow-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ToolFlow
  uninstallDisplayName: ToolFlow
  createDesktopShortcut: always
  createStartMenuShortcut: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: toolflow
  maintainer: ToolFlow <toolflow@localhost>
  category: Utility
  synopsis: Tự động tạo ảnh hàng loạt trên Google Flow
appImage:
  artifactName: ToolFlow-${version}-x86_64.${ext}
deb:
  artifactName: ToolFlow-${version}-amd64.${ext}
# Update source, baked into resources/app-update.yml (a generic url on *.invalid turns the updater off, see index.ts).
# Releases go out as a draft first and are made public only after every file is up and checked (docs/packaging.md), so an installed app never sees a half-uploaded version.
publish:
  provider: github
  owner: ngquang2901-blip
  repo: test1 # temporary host chosen by the owner (public; it holds only release files)
  releaseType: release # live at once; installed apps pick it up on their next check
